;;;
;;; PgBouncer config matching debian-12/docker-compose.local.yml
;;; Run from repo root: pgbouncer pgbouncer.ini
;;; Connect: psql -h localhost -p 6432 -U default -d postgres1  (or -d postgres2)
;;;

[databases]
postgres1 = host=127.0.0.1 port=5432 dbname=postgres1 user=default password=strongpassword
postgres2 = host=127.0.0.1 port=5432 dbname=postgres2 user=default password=strongpassword

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

;; Same as PGBOUNCER_AUTH_TYPE=plain
auth_type = plain
auth_file = userlist.txt

;; Optional: log to stdout when running in foreground
; logfile =
; pidfile =
